name: Test suite

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Compile, build, and test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate feedback endpoint without sending email
        run: php -l ui/public/api/feedback.php && node scripts/test-feedback.mjs

      - name: Verify retained legacy wallet transport flow control
        run: |
          node --test deploy/hostinger/patches/backpressure.test.mjs
          node deploy/hostinger/patches/apply-indexer-flow-control.mjs
          node scripts/test-indexer-backpressure.mjs

      - name: Install Compact developer tools
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh

      - name: Add Compact to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install pinned Compact toolchain
        run: |
          $HOME/.local/bin/compact update 0.31.1
          $HOME/.local/bin/compact update 0.36.0

      - name: Verify Midnight Passport restart modules and bounded Ledger 9 experiment
        run: |
          npm run build --workspace midnight-vote-polls
          npm run build --workspace @midnight-passport/connect
          npm run build --workspace midnight-vote-chain-v9
          npm run compile:polls -- --skip-zk
          npm run test:restart

      - name: Verify compile, build, and unit tests
        run: npm run verify:linux -- demo

      - name: Build production workspaces
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Upload API build for browser tests
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: api/dist/
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: Headless browser journey
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download verified API build
        uses: actions/download-artifact@v4
        with:
          name: api-dist
          path: api/dist

      - name: Build restart dependencies
        run: |
          npm run build --workspace midnight-vote-polls
          npm run build --workspace @midnight-passport/connect

      - name: Install desktop and mobile browser engines
        run: npx playwright install chromium webkit --with-deps

      - name: Run headless browser journey
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Build and verify the restart browser journeys
        run: npm run build:restart && npm run test:e2e:restart
        env:
          CI: 'true'

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
