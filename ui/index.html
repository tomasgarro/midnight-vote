<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/midnight-vote-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>midnight.vote — Your voice. Your choice. Your secret.</title>
    <meta name="description" content="A private, non-binding civic participation prototype. Understand a consultation with Cleisthenes, your guide, then say where you stand in private." />
    <!--
      Stamp the theme before first paint. The dark palette is keyed on
      data-theme alone, so without this a reader who chose dark would see the
      cream ground for one frame and then swap. Must stay in step with
      DEFAULT_THEME in src/integration/theme.ts: no stored value means light,
      and only an explicit 'system' follows the device.
    -->
    <script>
      (() => {
        let stored = null;
        try {
          stored = window.localStorage.getItem('cico-theme');
        } catch {
          stored = null;
        }
        let resolved = 'light';
        if (stored === 'light' || stored === 'dark') {
          resolved = stored;
        } else if (stored === 'system') {
          resolved =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.dataset.theme = resolved;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
